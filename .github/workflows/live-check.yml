name: Live-Check

# Prüft die veröffentlichte Seite (test/live.test.js): HTTPS-Umleitung, Zertifikat,
# jede Datei aus public/ live byte-identisch, Spiel läuft ohne Fehler.
# Läuft nach jedem Deploy (aus ci.yml), jede Nacht und auf Knopfdruck.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *" # täglich 04:17 UTC
  workflow_call:
    inputs:
      wait-ms:
        description: Wie lange maximal auf den neuen Stand gewartet wird (CDN-Cache nach Deploy)
        type: string
        default: "60000"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
        env:
          LIVE_WAIT_MS: ${{ inputs.wait-ms || '60000' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: live-check-report
          path: playwright-report/
          retention-days: 7
