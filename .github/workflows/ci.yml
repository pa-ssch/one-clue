name: Test und Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions sind auf Commit-SHAs festgenagelt (Lieferketten-Schutz); Dependabot hält
# SHA und Versionskommentar aktuell (.github/dependabot.yml).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ganze Historie, damit der VERSION-Check gegen die Basis vergleichen kann
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: VERSION in sw.js muss bei Änderungen in public/ hochgezählt sein
        run: node scripts/check-sw-version.js "${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}"
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Nur bei Commits auf main, und nur wenn die Tests bestanden haben
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Nach dem Deploy: Ist live wirklich der Stand aus dem Repo? (Details in live-check.yml)
  live:
    needs: deploy
    uses: ./.github/workflows/live-check.yml
    with:
      wait-ms: "300000" # bis zu 5 Minuten, bis der CDN-Cache den neuen Stand liefert
